<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="css/style.css">
    <title>Mi Dashboard</title>
</head>

<body>
    <div class="layout">
        <aside class="sidebar">
            <h2>Dashboard</h2>
            <nav>
                <ul>
                    <li>
                        <a href="#">
                            Inicio
                        </a>
                    </li>

                    <li>
                        <a href="#">
                            Usuarios
                        </a>
                    </li>

                    <li>
                        <a href="#">
                            Reportes
                        </a>
                    </li>
                </ul>
            </nav>
        </aside>

        <main class="content">
            <section>
                <h2>Resumen</h2>
                <div class="cards">
                    <article class="card">
                        <h3>Usuarios</h3>
                        <p id="totalUsuarios">150</p>
                    </article>

                    <article class="card">
                        <h3>Usuarios activos</h3>
                        <p>42</p>
                    </article>

                    <article class="card">
                        <h3>Nuevos usuarios</h3>
                        <p>18</p>
                    </article>
                </div>
            </section>

            <section>

                <h2>Usuarios registrados</h2>

                <table>
                    <thead>
                        <tr>
                            <th>Nombre</th>
                            <th>Email</th>
                            <th>Ciudad</th>
                        </tr>
                    </thead>

                    <tbody>
                        <tr>
                            <td>Carlos</td>
                            <td>carlos@email.com</td>
                            <td>Cúcuta</td>
                        </tr>
                    </tbody>
                </table>
            </section>

        </main>
    </div>
    <footer>
        <p>Universidad Francisco de Paula Santander - 2026</p>
    </footer>

</body>

</html>
